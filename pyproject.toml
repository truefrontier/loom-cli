[project]
name = "loom-cli"
version = "0.1.0"
description = "Unofficial read-only CLI for Loom. Sign in once, then list videos and pull official transcripts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "True Frontier" }]
dependencies = [
    "playwright>=1.40.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.scripts]
loom = "loom_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["loom_cli"]

[tool.hatch.build.targets.wheel.force-include]
"loom_cli/queries/GetLoomsForLibrary.json" = "loom_cli/queries/GetLoomsForLibrary.json"
"loom_cli/queries/GetVideoCardDetails.json" = "loom_cli/queries/GetVideoCardDetails.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
